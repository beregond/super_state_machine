# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # RTD clones shallow and without tags; versioningit needs them, or the
    # version (and the docs title) falls back to 0.0.0.
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# The package itself is installed too: conf.py reads its version from the
# installed metadata, and autodoc imports it.
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
